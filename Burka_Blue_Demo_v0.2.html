<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Burka Blue — Demo v0.2</title>
<style>
:root{--bg:#f2f0eb;--panel:#faf9f6;--panel2:#f4f2ed;--text:#343434;--muted:#85827b;--line:#d9d5cd;--accent:#6f756f;--hover:#e7e4dc;--hover-line:#c8c3b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Noto Serif SC","Songti SC",serif}.game{width:min(900px,92vw);margin:auto;padding:32px 0 60px}header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:1.1rem;letter-spacing:.18em;margin:0;font-weight:500}.subtitle{font-size:.82rem;color:var(--muted);margin-top:6px}button{font:inherit}#restart{border:1px solid var(--line);background:transparent;padding:8px 12px;color:var(--muted);cursor:pointer}#restart:hover{background:var(--hover);border-color:var(--hover-line);color:var(--text)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.84rem;padding:15px 2px}.card{background:var(--panel);border:1px solid var(--line);padding:42px clamp(24px,6vw,70px);min-height:510px}.node{font-size:.75rem;letter-spacing:.1em;color:var(--accent);margin-bottom:28px}.text{white-space:pre-line;font-size:1.05rem;line-height:2;min-height:260px}.choices{display:grid;gap:10px;margin-top:34px}.choice{width:100%;text-align:left;padding:15px 17px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;transition:.15s ease}.choice:hover{background:var(--hover);border-color:var(--hover-line)}.stats{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-top:0;background:#f7f5f1}.stat{padding:12px 8px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat span{display:block;font-size:.7rem;color:var(--muted);margin-bottom:4px}.stat strong{font-size:.9rem;font-weight:400}#statePanel{margin-top:18px;color:var(--muted);font-size:.78rem}#statePanel summary{cursor:pointer}pre{background:#e9e7e1;padding:14px;white-space:pre-wrap;overflow:auto}@media(max-width:650px){.stats{grid-template-columns:repeat(3,1fr)}.stat:nth-child(3){border-right:0}.stat:nth-child(-n+3){border-bottom:1px solid var(--line)}.card{min-height:580px;padding:30px 22px}}
</style></head><body><main class="game"><header><div><h1>BURKA BLUE</h1><div class="subtitle">Demo v0.2 · Day 1 · Flow Map Build</div></div><button id="restart">重新开始</button></header><div class="meta"><span id="place"></span><span id="time"></span></div><section class="card"><div id="node" class="node"></div><div id="text" class="text"></div><div id="choices" class="choices"></div></section><section class="stats"><div class="stat"><span>金钱</span><strong id="money"></strong></div><div class="stat"><span>精力</span><strong id="energy"></strong></div><div class="stat"><span>家庭</span><strong id="family"></strong></div><div class="stat"><span>Laila</span><strong id="laila"></strong></div><div class="stat"><span>独立性</span><strong id="independence"></strong></div></section><details id="statePanel"><summary>Debug · Game State</summary><pre id="debug"></pre></details></main>
<script>
const INITIAL={day:1,money:650,energy:100,family:70,laila:70,independence:50,morningRoute:null,blueCloth:false,blueClothSeen:false,work:null,lailaLearning:null,homeMorning:null,delegateActivity:null,node:"D1-N01"};
let state=clone(INITIAL);function clone(x){return JSON.parse(JSON.stringify(x))}
const nodes={
"D1-N01":{label:"D1-N01 · FAJR",place:"Home",time:"Dawn",text:"一天开始。\n\n黎明前的家里已经有人醒着。完成晨间祷告后，屋里重新安静下来。",choices:[["继续","D1-N02"]]},
"D1-N02":{label:"D1-N02 · BREAKFAST",place:"Home",time:"Morning",text:"早餐很简单。母亲提到家里有东西需要补充，上午最好有人去一趟市场。",choices:[["主动提出去","D1-N03",()=>state.independence+=1],["先不说话","D1-N03"],["建议让别人去","D1-N03",()=>state.family+=1]]},
"D1-N03":{label:"D1-N03 · MORNING DECISION",place:"Home",time:"08:00",text:"早餐结束后，事情还没有被决定。\n\n你需要决定上午怎么安排。",choices:[["去市场","D1-N04A",()=>{state.morningRoute="market";state.energy-=10;state.independence+=2}],["留在家里","D1-N04B",()=>{state.morningRoute="home";state.family+=1}],["让 Hamid 去","D1-N04C",()=>{state.morningRoute="delegate";state.independence-=1}]]},
"D1-N04A":{label:"D1-N04A · MARKET ROUTE",place:"Market",time:"Morning",text:"你完成了家里的采购。\n\n准备离开时，你注意到一块蓝色的布料。",choices:[["买下它","D1-N05",()=>{state.blueCloth=true;state.money-=400}],["不买","D1-N05"],["问了价格，再想想","D1-N05",()=>state.blueClothSeen=true]]},
"D1-N04B":{label:"D1-N04B · HOME ROUTE",place:"Home",time:"Morning",text:"你留在家里，处理了一些日常的事情。\n\nLaila 拿着一本英语书来找你。",choices:[["帮她看一会儿","D1-N05",()=>{state.homeMorning="help";state.laila+=2}],["告诉她晚一点","D1-N05",()=>state.homeMorning="later"],["让她先自己看","D1-N05",()=>{state.homeMorning="avoid";state.laila-=1}]]},
"D1-N04C":{label:"D1-N04C · DELEGATE ROUTE",place:"Home",time:"Morning",text:"Hamid 出门办事。家里暂时安静下来。\n\n你有一点自己的时间。",choices:[["读点东西","D1-N05",()=>state.delegateActivity="read"],["休息","D1-N05",()=>{state.delegateActivity="rest";state.energy=Math.min(100,state.energy+10)}],["帮母亲做事","D1-N05",()=>{state.delegateActivity="help";state.family+=2}]]},
"D1-N05":{label:"D1-N05 · MIDDAY MERGE",place:"Home",time:"Dhuhr / Lunch",dynamicText:()=>{let c="";if(state.morningRoute==="market")c=state.blueCloth?"你把买来的东西放下。蓝色布料另外包着。":state.blueClothSeen?"市场上的蓝色布料还留在你的记忆里。":"上午的采购已经结束。";if(state.morningRoute==="home")c=state.homeMorning==="help"?"Laila 把英语书放在一边。":state.homeMorning==="later"?"Laila 的书还放在桌上。":"上午的事情已经做完。";if(state.morningRoute==="delegate")c=state.delegateActivity==="read"?"你刚才读的几页还摊在桌上。":state.delegateActivity==="rest"?"短暂的休息让你清醒了一些。":"Hamid 已经回来，家里的事情暂时告一段落。";return c+"\n\n到了中午。不同的上午在这里结束，家人重新聚在一起吃饭。"},choices:[["继续","D1-N06"]]},
"D1-N06":{label:"D1-N06 · WORK OFFER",place:"Home",time:"Early Afternoon",text:"午后，你收到 Farzana 的消息。\n\n她问你愿不愿意接一份小型缝纫工作。",choices:[["接受","D1-N07",()=>state.work="accepted"],["谈谈条件","D1-N07",()=>state.work="negotiated"],["拒绝","D1-N07",()=>state.work="declined"]]},
"D1-N07":{label:"D1-N07 · LAILA EVENT",place:"Home",time:"Afternoon",text:"Laila 又提起那本英语书。\n\n这次她直接问你：能不能以后继续学？",choices:[["支持她","D1-N08",()=>{state.lailaLearning="supported";state.laila+=5}],["不明确表态","D1-N08",()=>{state.lailaLearning="neutral";state.laila+=1}],["回避这个话题","D1-N08",()=>{state.lailaLearning="avoided";state.laila-=3}]]},
"D1-N08":{label:"D1-N08 · LATE AFTERNOON",place:"Home",time:"Late Afternoon",dynamicText:()=>state.work==="accepted"?"你开始处理 Farzana 交来的工作。\n\n下午剩下的时间被一件件具体的小事填满。":state.work==="negotiated"?"你按照重新谈好的条件开始准备工作。\n\n事情还没有结束，但至少已经开始。":"你没有接下那份工作。\n\n下午突然多出一段没有安排的时间。",choices:null},
"D1-N09":{label:"D1-N09 · MAGHRIB",place:"Home",time:"Evening",text:"傍晚到来。\n\n一天进入下一段固定的节奏。",choices:[["继续","D1-N10"]]},
"D1-N10":{label:"D1-N10 · DINNER",place:"Home",time:"Dinner",dynamicText:()=>{let r=[];if(state.blueCloth)r.push("桌边放着那块蓝色布料。");else if(state.work==="accepted"||state.work==="negotiated")r.push("有人问起你下午接下的工作。");else r.push("晚饭的话题没有离开家里的日常。");if(state.lailaLearning==="supported")r.push("Laila 在饭后把英语书拿得更近了一些。");else if(state.lailaLearning==="avoided")r.push("Laila 吃饭时比平常安静。");return r.join("\n\n")+"\n\n晚饭结束后，碗筷被收起来。"},choices:[["继续","D1-N11"]]},
"D1-N11":{label:"D1-N11 · ISHA",place:"Home",time:"Night",text:"夜晚。\n\n完成一天最后的祷告后，屋里的声音渐渐少下来。",choices:[["继续","D1-N12"]]},
"D1-N12":{label:"D1-N12 · NIGHT",place:"Home",time:"Late Night",dynamicText:()=>{let h=[];if(state.blueCloth)h.push("蓝色布料被放在一旁。");else if(state.blueClothSeen)h.push("你想起市场里那块蓝色布料。");if(state.work==="accepted")h.push("明天还有 Farzana 的工作。");if(state.work==="negotiated")h.push("重新谈好的工作条件已经定下来。");if(state.lailaLearning==="supported")h.push("Laila 的英语书还在桌上。");if(!h.length)h.push("今天没有留下特别需要处理的事情。");return h.join("\n\n")+"\n\n\nDAY 1 END";},choices:[["重新开始 Day 1","RESTART"]]}
};
nodes["D1-N08"].choices=()=>state.work==="declined"?[["休息","D1-N09",()=>state.energy=Math.min(100,state.energy+8)],["读点东西","D1-N09"],["做家务","D1-N09",()=>state.family+=1]]:[["继续完成一部分工作","D1-N09",()=>state.energy-=8],["先停下来","D1-N09",()=>state.energy-=3]];
function render(){const n=nodes[state.node];document.getElementById("node").textContent=n.label;document.getElementById("place").textContent="Day 1 · "+n.place;document.getElementById("time").textContent=n.time;document.getElementById("text").textContent=n.dynamicText?n.dynamicText():n.text;const choices=typeof n.choices==="function"?n.choices():n.choices;const box=document.getElementById("choices");box.innerHTML="";choices.forEach(([label,next,effect])=>{const b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>{if(next==="RESTART"){state=clone(INITIAL);render();return}if(effect)effect();state.node=next;render()};box.appendChild(b)});updateHUD()}
function updateHUD(){money.textContent=state.money+" AFN";energy.textContent=state.energy;family.textContent=state.family;laila.textContent=state.laila;independence.textContent=state.independence;debug.textContent=JSON.stringify(state,null,2)}
restart.onclick=()=>{state=clone(INITIAL);render()};render();
</script></body></html>
